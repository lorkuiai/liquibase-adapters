name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Liquibase ${{ matrix.liquibase-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        liquibase-version:
          - 4.33.0
          - 5.0.3

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew test -PliquibaseVersion=${{ matrix.liquibase-version }} --no-daemon
